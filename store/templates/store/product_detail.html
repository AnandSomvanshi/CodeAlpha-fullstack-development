{% extends 'store/base.html' %}

{% block content %}
<div class="row mt-4">
  <!-- Product Image -->
  <div class="col-md-6">
    {% if product.image %}
      <img src="{{ product.image.url }}" class="img-fluid rounded shadow-sm">
    {% else %}
      <img src="{% static 'store/default.png' %}" class="img-fluid rounded shadow-sm">
    {% endif %}
  </div>

  <!-- Product Details -->

    <h2>{{ product.name }}</h2>
    <p class="text-muted"><strong>Price:</strong> ₹{{ product.price }}</p>

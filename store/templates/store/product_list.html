{% extends 'store/base.html' %}

{% block content %}
<h3 class="mb-4">Our Products</h3>

<div class="row">
  {% for product in products %}
  <div class="col-md-4 mb-4">
    <div class="card shadow-sm h-100">

      <!-- Product Image -->
      {% if product.image %}
      <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
      {% else %}
      <img src="https://dummyimage.com/400x250/cccccc/000000&text=Product+Image"
           class="card-img-top" alt="Placeholder Image">
      {% endif %}

      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="text-muted mb-3">₹{{ product.price }}</p>

        <div class="mt-auto d-flex gap-2">
          <a href="{% url 'product_detail' product.pk %}" class="btn btn-primary btn-sm flex-fill">
             View Details
          </a>
          <a href="{% url 'add_to_cart' product.pk %}" class="btn btn-success btn-sm flex-fill">
             Add to Cart
          </a>
        </div>
      </div>

    </div>
  </div>
  {% empty %}
  <p class="text-muted">No products available at the moment.</p>
  {% endfor %}
</div>
{% endblock %}

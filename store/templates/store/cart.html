{% extends 'store/base.html' %}
{% block content %}
<h1>Your Cart</h1>
{% if items %}
    <ul class="list-group">
        {% for item in items %}
        <li class="list-group-item">{{ item.product.name }} - {{ item.quantity }} x ₹{{ item.subtotal }}</li>
        {% endfor %}
    </ul>
    <p>Total: ₹{{ total }}</p>
    <a href="{% url 'checkout' %}" class="btn btn-primary">Checkout</a>
{% else %}
    <p>Your cart is empty.</p>
{% endif %}
{% endblock %}
